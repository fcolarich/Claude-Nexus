# Claude Nexus v2 — model + pipeline configuration.
# Edit this file to point Nexus at different local models or endpoints.
# Loaded by src/core/config.ts (getNexusConfig). If this file is missing,
# Nexus falls back to the defaults baked into that loader.

# Embedding model — used for vector search and dedup similarity.
embedding:
  provider: ollama
  endpoint: http://127.0.0.1:11434/api/embed
  model: mxbai-embed-large
  dimensions: 1024          # must match the vec0 table width (memories_vec / atoms_vec)
  timeout_ms: 15000

# Reflector — distills session transcripts into typed memories.
#   provider: claude-agent-sdk  -> drives the local `claude` CLI (OAuth / Max plan, no API key)
#   provider: openai-compatible -> POSTs to a local llama.cpp / Ollama /v1 chat endpoint
extraction:
  provider: claude-agent-sdk
  model: claude-haiku-4-5-20251001
  timeout_ms: 120000
  # endpoint + temperature are used only when provider is openai-compatible:
  endpoint: http://127.0.0.1:11434/v1/chat/completions
  temperature: 0.2

# Recall — memory injection.
# Bulk recall (nexus_recall MCP tool, web API) is ranked by the decay model
# (src/core/decay.ts), keyed on each memory's decay_class.
# Prompt-driven recall (UserPromptSubmit hook) is ranked by vector similarity.
recall:
  max_tokens: 2000              # hard cap on bulk-recall injected context
  min_confidence: 0.35          # effective (decayed) confidence below this is not bulk-injected
  min_words: 6                  # user prompts shorter than this skip prompt-driven recall
  min_similarity: 0.6          # cosine floor (0-1) a memory must clear to be prompt-injected

# Capture — Reflector write thresholds + markdown export target.
capture:
  auto_approve_confidence: 0.85 # >= this is stored approved; below = pending review
  dedup_cosine_threshold: 0.86  # a candidate this similar to an existing memory = merge
  # export_dir intentionally omitted here — falls back to the code default in
  # src/core/config.ts (~/.claude/memories/exports), a Nexus-owned sandbox.
  # Do NOT point this at ~/.claude/projects: that is Claude Code's own
  # auto-memory directory, auto-loaded in full at every session start, which
  # duplicates and conflicts with prompt-runner's per-prompt relevance-floored
  # recall. See _documents/decisions/ for the ADR on this reversal.

# Reranker — cross-encoder pass (jina-reranker-v2-base-multilingual) applied to
# prompt-driven recall candidates before the relevance floor. Auto-spawned on
# first use if not already running. Disabled by default (script_path is
# machine-specific).
reranker:
  enabled: true
  endpoint: http://127.0.0.1:8931/rerank
  script_path: C:/Fran/Cloned Repos/local-reranker-mcp/server.py
  threshold: 0.2          # cross-encoder score floor (nexus atoms/memories convention)
  timeout_ms: 10000

# Capture exclusion — sessions whose ORIGIN disqualifies them from writing
# memories at all. Book/article processing belongs in the Knowledge bases, not
# Nexus; distill-audit runs otherwise capture commentary about their own
# auditing. Content-level filtering (file bodies from Read/Grep/etc.) is
# separate and lives in src/capture/transcript.ts.
# Also honoured: NEXUS_NO_CAPTURE=1 in the environment.
exclude:
  commands:
    - harvest-knowledge
    - extract-knowledge
    - add-book-to-encyclopedia
    - book-encyclopedia-batch
  scheduled_tasks:
    - nexus-memory-distill
